apiVersion: v1
kind: ConfigMap
metadata: {name: fluent-bit-config, namespace: observability}
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush 1
        Log_Level info
        Parsers_File parsers.conf
    [INPUT]
        Name tail
        Tag kube.*
        Path /var/log/containers/*_lab_*.log
        Parser cri
        DB /var/fluent-bit/state/tail.db
        Mem_Buf_Limit 5MB
        Skip_Long_Lines On
    [FILTER]
        Name kubernetes
        Match kube.*
        Kube_Tag_Prefix kube.var.log.containers.
        Merge_Log On
        Keep_Log Off
    [OUTPUT]
        Name stdout
        Match kube.*
        Format json_lines
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: fluent-bit, namespace: observability, labels: {app: fluent-bit}}
spec:
  selector: {matchLabels: {app: fluent-bit}}
  template:
    metadata:
      labels: {app: fluent-bit}
      annotations: {lab.k3s-devops.invalid/config-revision: paused}
    spec:
      serviceAccountName: fluent-bit
      tolerations: [{operator: Exists}]
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:5.1.5
          ports: [{name: metrics, containerPort: 2020}]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 300m, memory: 256Mi}}
          volumeMounts:
            - {name: config, mountPath: /fluent-bit/etc/fluent-bit.conf, subPath: fluent-bit.conf, readOnly: true}
            - {name: parsers, mountPath: /fluent-bit/etc/parsers.conf, subPath: fluent-bit-parsers.conf, readOnly: true}
            - {name: containers, mountPath: /var/log/containers, readOnly: true}
            - {name: pods, mountPath: /var/log/pods, readOnly: true}
            - {name: state, mountPath: /var/fluent-bit/state}
      volumes:
        - {name: config, configMap: {name: fluent-bit-config}}
        - {name: parsers, configMap: {name: fluent-bit-parsers}}
        - {name: containers, hostPath: {path: /var/log/containers, type: Directory}}
        - {name: pods, hostPath: {path: /var/log/pods, type: Directory}}
        - {name: state, hostPath: {path: /var/lib/fluent-bit, type: DirectoryOrCreate}}
