apiVersion: apps/v1
kind: Deployment
metadata: {name: orders-api, namespace: lab}
spec:
  template:
    spec:
      containers:
        - name: api
          env: [{name: FAULT_STARTUP_ALLOC_MB, value: "512"}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 128Mi}
