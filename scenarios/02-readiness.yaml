apiVersion: apps/v1
kind: Deployment
metadata: {name: orders-api, namespace: lab}
spec:
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  template:
    spec:
      containers:
        - name: api
          readinessProbe: {httpGet: {path: /wrong-ready-path, port: http}, initialDelaySeconds: 2, periodSeconds: 3}
