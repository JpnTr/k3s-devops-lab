groups:
  - name: orders-api
    rules:
      - alert: OrdersApiHigh5xx
        expr: sum(rate(orders_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(orders_http_requests_total[5m])), 0.001) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations: {summary: Orders API 5xx ratio exceeds 5 percent}
      - alert: OrdersApiHighP95
        expr: histogram_quantile(0.95, sum by (le,route) (rate(orders_http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 2m
        labels: {severity: warning}
        annotations: {summary: Orders API p95 exceeds 500ms}
      - alert: OrdersApiMetricsMissing
        expr: up{job="orders-api"} == 0
        for: 2m
        labels: {severity: warning}
        annotations: {summary: Orders API metrics scrape is unavailable}
      - alert: OrdersApiTargetMissing
        expr: absent(up{job="orders-api"})
        for: 2m
        labels: {severity: warning}
        annotations: {summary: No Orders API scrape target is discovered}
