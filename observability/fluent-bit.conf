[SERVICE]
    Flush 1
    Log_Level info
    Parsers_File parsers.conf
[INPUT]
    Name tail
    Tag kube.*
    Path /var/log/containers/*_lab_*.log
    Parser cri
    DB /var/fluent-bit/state/tail.db
    Mem_Buf_Limit 5MB
    Skip_Long_Lines On
[FILTER]
    Name kubernetes
    Match kube.*
    Kube_Tag_Prefix kube.var.log.containers.
    Merge_Log On
    Keep_Log Off
[OUTPUT]
    Name es
    Match kube.*
    Host elasticsearch.observability.svc
    Port 9200
    Logstash_Format On
    Logstash_Prefix orders-logs
    Suppress_Type_Name On
    Retry_Limit 5
