global:
  scrape_interval: 15s
  evaluation_interval: 15s
scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: [localhost:9090]}]
  - job_name: orders-api
    kubernetes_sd_configs:
      - role: endpoints
        refresh_interval: 15s
    relabel_configs:
      - {source_labels: [__meta_kubernetes_namespace], action: keep, regex: lab}
      - {source_labels: [__meta_kubernetes_service_label_app_kubernetes_io_name], action: keep, regex: orders-api}
      - {source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape], action: keep, regex: "true"}
      - {source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path], target_label: __metrics_path__}
      - {source_labels: [__meta_kubernetes_endpoint_port_name], action: keep, regex: http}
      - {source_labels: [__meta_kubernetes_pod_name], target_label: pod}
      - {source_labels: [__meta_kubernetes_service_name], target_label: service}
      - {source_labels: [__meta_kubernetes_namespace], target_label: namespace}
      - {source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_version], target_label: version}
  - job_name: kube-state-metrics
    static_configs: [{targets: [kube-state-metrics.observability.svc:8080]}]
  - job_name: kubernetes-cadvisor
    scheme: https
    tls_config: {insecure_skip_verify: true}
    bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
    kubernetes_sd_configs: [{role: node}]
    relabel_configs:
      - {target_label: __address__, replacement: kubernetes.default.svc:443}
      - {source_labels: [__meta_kubernetes_node_name], target_label: __metrics_path__, replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor}
rule_files: [/etc/prometheus/rules.yml]
