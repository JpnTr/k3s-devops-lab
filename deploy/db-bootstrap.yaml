apiVersion: v1
kind: ConfigMap
metadata: {name: db-bootstrap, namespace: lab}
data:
  001.sql: |
    SELECT format('CREATE ROLE orders_app LOGIN PASSWORD %L', :'app_password')
    WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'orders_app')
    \gexec
    ALTER ROLE orders_app WITH LOGIN PASSWORD :'app_password';
    CREATE TABLE IF NOT EXISTS orders (
      id BIGSERIAL PRIMARY KEY,
      sku VARCHAR(64) NOT NULL CHECK (length(sku) BETWEEN 1 AND 64),
      quantity INTEGER NOT NULL CHECK (quantity BETWEEN 1 AND 10000),
      created_at TIMESTAMPTZ NOT NULL DEFAULT now(),
      fixture_key VARCHAR(96) UNIQUE
    );
    ALTER TABLE orders ADD COLUMN IF NOT EXISTS fixture_key VARCHAR(96) UNIQUE;
    INSERT INTO orders (sku, quantity, fixture_key) VALUES
      ('FIXTURE-ALPHA', 1, 'fixture-alpha'),
      ('FIXTURE-BRAVO', 2, 'fixture-bravo'),
      ('FIXTURE-CHARLIE', 3, 'fixture-charlie')
    ON CONFLICT (fixture_key) DO NOTHING;
    GRANT SELECT, INSERT ON orders TO orders_app;
    GRANT DELETE ON orders TO orders_app;
    GRANT USAGE, SELECT ON SEQUENCE orders_id_seq TO orders_app;
---
apiVersion: batch/v1
kind: Job
metadata: {name: db-bootstrap, namespace: lab}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bootstrap
          image: postgres:18.7-alpine
          command: [sh, -c]
          args: ['PGPASSWORD="$POSTGRES_PASSWORD" psql -h postgres -U postgres -d orders -v ON_ERROR_STOP=1 -v app_password="$APP_PASSWORD" -f /sql/001.sql']
          env:
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-auth, key: POSTGRES_PASSWORD}}}
            - {name: APP_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-auth, key: APP_PASSWORD}}}
          volumeMounts: [{name: sql, mountPath: /sql}]
      volumes: [{name: sql, configMap: {name: db-bootstrap}}]
