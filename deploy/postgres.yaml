apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: postgres-data, namespace: lab}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 2Gi}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: postgres, namespace: lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: postgres}}
  template:
    metadata: {labels: {app: postgres}}
    spec:
      nodeSelector: {lab.k3s-devops.invalid/control-plane: "true"}
      containers:
        - name: postgres
          image: postgres:18.7-alpine
          env:
            - {name: POSTGRES_DB, value: orders}
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-auth, key: POSTGRES_PASSWORD}}}
          ports: [{containerPort: 5432}]
          # PostgreSQL 18 official images store PGDATA below this volume root.
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
          resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: 1, memory: 1Gi}}
          readinessProbe: {exec: {command: [sh, -c, 'pg_isready -U postgres -d orders']}, initialDelaySeconds: 5}
      volumes: [{name: data, persistentVolumeClaim: {claimName: postgres-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: lab}
spec:
  selector: {app: postgres}
  ports: [{port: 5432, targetPort: 5432}]
