apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: lab
  labels: {app.kubernetes.io/name: orders-api, app.kubernetes.io/part-of: k3s-devops-lab}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector:
    matchLabels: {app.kubernetes.io/name: orders-api}
  template:
    metadata:
      labels: {app.kubernetes.io/name: orders-api, app.kubernetes.io/version: v1}
    spec:
      nodeSelector: {lab.k3s-devops.invalid/worker: "true"}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app.kubernetes.io/name: orders-api}}
      containers:
        - name: api
          image: k3s-devops-lab/orders-api:dev
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: APP_VERSION, value: v1}
            - {name: DB_HOST, value: postgres.lab.svc.cluster.local}
            - {name: DB_NAME, value: orders}
            - {name: DB_USER, value: orders_app}
            - {name: DB_PASSWORD, valueFrom: {secretKeyRef: {name: orders-api-db, key: DB_PASSWORD}}}
            - {name: DB_POOL_MAX, value: "5"}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          livenessProbe: {httpGet: {path: /livez, port: http}, initialDelaySeconds: 3}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 3}
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: lab
  annotations: {prometheus.io/scrape: "true", prometheus.io/path: /metrics, prometheus.io/port: "8000"}
spec:
  selector: {app.kubernetes.io/name: orders-api}
  ports: [{name: http, port: 80, targetPort: http}]
